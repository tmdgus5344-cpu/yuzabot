<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>챗봇</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --brand:#2563eb; --user:#2563eb; --bot:#eef0f4; --line:#e3e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#eceef2; --muted:#9aa1ad; --brand:#5b8def; --user:#3b6fd9; --bot:#2a2e36; --line:#2f343d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100dvh; display: flex; flex-direction: column; background: var(--card); }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; line-height: 1.55; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--user); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.err { background: transparent; border: 1px dashed #d97706; color: #b45309; }
  .msg.err .retry { margin-left: 6px; border: 1px solid #d97706; background: transparent; color: inherit; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  #examples { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  #examples button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  #examples button:hover { border-color: var(--brand); }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--card); color: var(--text); max-height: 120px; }
  #send { border: 0; background: var(--brand); color: #fff; border-radius: 12px; padding: 0 18px; font-size: 15px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 0 16px 10px; }

  /* ── 꾸미기 (config.js의 theme 값으로 바뀜) ── */
  .user { color: var(--on-brand, #fff); }
  #send { color: var(--on-brand, #fff); }
  header { display: flex; align-items: center; gap: 12px; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; line-height: 1; background: var(--bot); overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  header .av { width: 44px; height: 44px; font-size: 26px; }
  .row { display: flex; align-items: flex-end; gap: 8px; align-self: flex-start; max-width: 92%; }
  .row .msg { max-width: none; }
  body.head-color header { background: var(--brand); border-bottom-color: transparent; }
  body.head-color header h1, body.head-color header p { color: var(--on-brand, #fff); }
  body.head-color header p { opacity: .85; }
  body.head-color header .av { background: rgba(255,255,255,.9); }
  body.bg-soft #log { background: color-mix(in srgb, var(--brand) 7%, var(--card)); }
  body.bg-dots #log { background-color: var(--card); background-image: radial-gradient(color-mix(in srgb, var(--brand) 22%, transparent) 1.2px, transparent 1.3px); background-size: 18px 18px; }
  body.bg-wave #log { background: linear-gradient(180deg, var(--card) 0%, color-mix(in srgb, var(--brand) 12%, var(--card)) 100%); }
  body.bubble-square .msg { border-radius: 6px; }
  body.bubble-pill .msg { border-radius: 22px; padding: 11px 16px; }
  body.bubble-pill .bot { border-bottom-left-radius: 6px; }
  body.bubble-pill .user { border-bottom-right-radius: 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="av" id="head-av" aria-hidden="true"></span>
    <div><h1 id="name"></h1><p id="tagline"></p></div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div id="examples"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="질문을 입력하세요" autocomplete="off"></textarea>
    <button id="send" type="submit">보내기</button>
  </form>
  <footer>AI가 만든 답변이라 틀릴 수 있어요. 중요한 내용은 직접 확인하세요. 개인정보는 입력하지 마세요.</footer>
</div>

<script src="config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), sendBtn = $('send');
  const history = [];
  let busy = false;

  // ── 꾸미기: config.js의 theme 값을 화면에 적용한다 (값이 없거나 틀리면 기본 모양) ──
  const T = CONFIG.theme || {};
  const pick = (v, list, d) => (list.indexOf(v) >= 0 ? v : d);
  const color = /^#[0-9a-fA-F]{6}$/.test(T.color || '') ? T.color : '#2563eb';
  const rgb = [1, 3, 5].map((i) => parseInt(color.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  const light = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2] > 0.179;   // 밝은 색이면 글자를 검게 (흰 글자보다 검은 글자가 더 잘 보일 때)
  document.documentElement.style.setProperty('--brand', color);
  document.documentElement.style.setProperty('--user', color);
  document.documentElement.style.setProperty('--on-brand', light ? '#1c1f24' : '#ffffff');
  document.body.classList.add('head-' + pick(T.header, ['line', 'color'], 'line'));
  document.body.classList.add('bg-' + pick(T.background, ['plain', 'soft', 'dots', 'wave'], 'plain'));
  document.body.classList.add('bubble-' + pick(T.bubble, ['round', 'square', 'pill'], 'round'));
  const avatar = String(T.avatar || '').trim();
  function avatarEl(el) {
    if (!avatar) { el.remove(); return; }
    if (/^(https:\/\/|images\/)[^\s"'<>]+$/.test(avatar)) {       // 그림 주소면 그림으로
      const im = document.createElement('img'); im.src = avatar; im.alt = ''; el.appendChild(im);
    } else {
      el.textContent = Array.from(avatar).slice(0, 2).join('');    // 이모지나 글자 한두 개
    }
  }
  avatarEl($('head-av'));

  document.title = CONFIG.botName;
  $('name').textContent = CONFIG.botName;
  $('tagline').textContent = CONFIG.tagline;
  add('bot', CONFIG.greeting);

  (CONFIG.examples || []).forEach((q) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = q;
    b.onclick = () => ask(q);
    $('examples').appendChild(b);
  });

  function systemPrompt() {
    return [
      CONFIG.role.trim(),
      '[말투]\n' + CONFIG.tone.trim(),
      '[규칙]\n' + CONFIG.rules.trim(),
      '[참고 정보]\n' + CONFIG.knowledge.trim()
    ].join('\n\n');
  }

  function add(kind, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + kind;
    d.textContent = text;           // textContent 사용: 답변 안의 코드가 실행되지 않게
    if (kind === 'bot' && avatar) {   // 챗봇 말풍선 옆에 프로필
      const row = document.createElement('div'); row.className = 'row';
      const av = document.createElement('span'); av.className = 'av'; av.setAttribute('aria-hidden', 'true'); avatarEl(av);
      row.appendChild(av); row.appendChild(d); log.appendChild(row);
    } else {
      log.appendChild(d);
    }
    log.scrollTop = log.scrollHeight;
    return d;
  }

  // 서버에 질문을 보내고 { reply } 또는 { error } 를 돌려줍니다. (대화 기록은 바꾸지 않습니다)
  async function call(text) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 60000);   // 60초가 지나도 답이 없으면 그만 기다린다
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system: systemPrompt(), messages: history.concat({ role: 'user', content: text }) }),
        signal: ctl.signal
      }).finally(() => clearTimeout(timer));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return { error: data.error || '오류가 발생했어요.' };
      return { reply: data.reply };
    } catch (e) {
      return { error: '답이 오지 않거나 연결에 실패했어요. 잠시 후 다시 해 주세요.' };
    }
  }

  async function ask(text, again) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true;
    $('examples').style.display = 'none';
    if (!again) add('user', text);          // 다시 보내기일 때는 내 말풍선을 또 만들지 않는다
    input.value = ''; input.style.height = 'auto';
    const wait = add('bot', '답변을 만드는 중…');
    let result = await call(text);
    // AI가 바쁠 때(503)는 잠시 뒤 자동으로 한 번 더 시도한다
    if (result.error && /503/.test(result.error)) {
      wait.textContent = 'AI가 바빠서 잠시 뒤 한 번 더 시도해요…';
      await new Promise((ok) => setTimeout(ok, 3000));
      result = await call(text);
    }
    if (result.reply !== undefined) {
      wait.textContent = result.reply;
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: result.reply });
    } else {
      wait.className = 'msg err';
      wait.textContent = result.error + ' ';
      const again = document.createElement('button');
      again.type = 'button';
      again.className = 'retry';
      again.textContent = '다시 보내기';
      again.onclick = () => { (wait.parentNode.classList.contains('row') ? wait.parentNode : wait).remove(); ask(text, true); };
      wait.appendChild(again);              // 실패한 질문은 대화 기록에 넣지 않는다
    }
    busy = false; sendBtn.disabled = false; input.focus();
    log.scrollTop = log.scrollHeight;
  }

  $('form').addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); }
  });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
</script>
</body>
</html>
